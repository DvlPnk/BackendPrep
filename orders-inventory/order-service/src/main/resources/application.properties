spring.application.name=order-service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/orders_db
spring.datasource.username=${ORDERS_DB_USERNAME}
spring.datasource.password=${ORDERS_DB_PASSWORD}

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${ORDERS_MIGRATION_USERNAME}
spring.flyway.password=${ORDERS_MIGRATION_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate