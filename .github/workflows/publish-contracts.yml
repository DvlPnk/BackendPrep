name: Publish Inventory Contracts

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
  
    defaults:
      run:
        working-directory: orders-inventory/inventory-contracts
    
    steps:
      - name: Download repository
        uses: actions/checkout@v5
      
      - name: Download java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and publish
        run: bash ./gradlew build publish --no-daemon
        env:
          GITHUB_ACTOR: ${{github.actor}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}