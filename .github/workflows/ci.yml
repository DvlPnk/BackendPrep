name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: order-service
            database: orders_test_db
          - service: inventory-service
            database: inventory_test_db

    defaults:
      run:
        working-directory: orders-inventory/${{ matrix.service }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: ${{ matrix.database }}
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
      MIGRATION_USERNAME: ci_user
      MIGRATION_PASSWORD: ci_password
      ORDERS_DB_USERNAME: ci_user
      ORDERS_DB_PASSWORD: ci_password
      ORDERS_MIGRATION_USERNAME: ci_user
      ORDERS_MIGRATION_PASSWORD: ci_password

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and install inventory contracts
        working-directory: orders-inventory/inventory-contracts
        run: bash ./gradlew build publishToMavenLocal --no-daemon

      - name: Build and test
        run: bash ./gradlew build --no-daemon