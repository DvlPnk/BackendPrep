name: Dependency Submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependencies:
    name: Dependencies for ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        service: [order-service, inventory-service]
    
    steps:
      - name: Download Repository
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      
      - name: Generate and submit dependencies
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: orders-inventory/${{matrix.service}}